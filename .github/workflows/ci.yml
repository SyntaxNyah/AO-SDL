name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  repository_dispatch:
    types: [run_build]

jobs:
  # ---- Formatting check (fast, Linux-only) ----
  formatting:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          # The tree is formatted with clang-format 19; 17/18 report violations
          # on code 19 accepts (e.g. `struct pollfd pfd{};`), so pin the major
          # version instead of silently falling back to whatever apt defaults to.
          sudo apt-get install -y clang-format-19
          clang-format-19 --version
      - name: Check formatting
        run: |
          CF=clang-format-19
          # Mirrors .githooks/pre-commit: every tracked C++/ObjC++ file outside
          # third-party/. Using git ls-files keeps vendored and generated files
          # out of the check without a directory list that can drift.
          git ls-files -z -- '*.cpp' '*.h' '*.mm' ':(exclude)third-party' |
            xargs -0 -r "$CF" --dry-run --Werror

  # ---- Build, test, and package per OS ----
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            coverage: true

          - name: macOS
            os: macos-latest
            # llama.cpp is off by default for non-server builds (the
            # CMake default gates on AO_BUILD_SERVER_ONLY). No explicit
            # -DKAGAMI_WITH_LLAMA_CPP=OFF needed.
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            xcode: '26.3'

          - name: Windows
            os: windows-latest
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            cmake_generator: -G Ninja

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---- Python (consistent version for schema generation) ----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Locate Python for CMake
        id: python-path
        run: echo "executable=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_OUTPUT"
        shell: bash

      # ---- Platform dependencies ----
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libglew-dev libssl-dev

      - name: Install dependencies (Linux, coverage)
        if: matrix.coverage
        run: sudo apt-get install -y lcov

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Select Xcode
        if: matrix.xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      # ---- Configure ----
      - name: Configure
        run: cmake -B build ${{ matrix.cmake_generator }} ${{ matrix.cmake_args }} -DPython3_EXECUTABLE="${{ steps.python-path.outputs.executable }}"

      - name: Configure (coverage)
        if: matrix.coverage
        run: cmake -B build-coverage -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_C_FLAGS="--coverage" -DPython3_EXECUTABLE="${{ steps.python-path.outputs.executable }}"

      # ---- Build ----
      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Build (coverage)
        if: matrix.coverage
        run: cmake --build build-coverage --target aosdl_tests aosdl_widget_tests --config Debug --parallel 2

      # ---- Test ----
      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --build-config Release

      - name: Run tests (coverage)
        if: matrix.coverage
        working-directory: build-coverage
        run: ctest --output-on-failure --build-config Debug

      # ---- Coverage report ----
      - name: Generate coverage report
        if: matrix.coverage
        run: |
          lcov --capture --directory build-coverage --output-file coverage.info \
               --ignore-errors mismatch,gcov,negative
          lcov --remove coverage.info \
               '/usr/*' '*/third-party/*' '*/tests/*' '*/build-coverage/*' \
               --output-file coverage.info \
               --ignore-errors unused,negative
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # ---- Package artifacts ----
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifact
          cp build/apps/sdl/aosdl artifact/
          strip artifact/aosdl
          tar czf aosdl-linux-x64.tar.gz -C artifact .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifact
          cp build/apps/sdl/aosdl artifact/
          strip artifact/aosdl
          codesign --force --sign - artifact/aosdl
          tar czf aosdl-macos-arm64.tar.gz -C artifact .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifact
          cp build/apps/sdl/aosdl.exe artifact/
          cp build/apps/sdl/*.dll artifact/ 2>/dev/null || true
          cp third-party/glew/bin/Release/x64/glew32.dll artifact/ 2>/dev/null || true
          cp "/c/Program Files/OpenSSL/bin/libssl-3-x64.dll" artifact/ 2>/dev/null || true
          cp "/c/Program Files/OpenSSL/bin/libcrypto-3-x64.dll" artifact/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aosdl-${{ runner.os }}
          path: |
            aosdl-*.tar.gz
            artifact/

  # ---- Build & push multi-arch Kagami Docker image to GHCR ----
  docker:
    name: Docker (Kagami)
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Repository owner (lowercase)
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/kagami:latest
            ghcr.io/${{ env.REPO_OWNER }}/kagami:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Deploy gate ----
  # Secrets cannot be referenced from a job-level `if`, so probe them here and
  # let `deploy` read the result. A repository without AWS/CloudFormation
  # secrets (a fork, for example) skips the deploy instead of failing it.
  deploy-gate:
    name: Deploy gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    outputs:
      enabled: ${{ steps.secrets.outputs.enabled }}
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CF_STACK_NAME: ${{ secrets.CF_STACK_NAME }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || \
             [ -z "$AWS_REGION" ] || [ -z "$CF_STACK_NAME" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging deploy skipped - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION and CF_STACK_NAME are not all configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  # ---- Deploy Kagami staging via SSM ----
  deploy:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    needs: [docker, deploy-gate]
    if: needs.deploy-gate.outputs.enabled == 'true'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Find instance by stack name
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:cloudformation:stack-name,Values=${{ secrets.CF_STACK_NAME }}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No running instance found for the configured CloudFormation stack"
            exit 1
          fi
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Instance: $INSTANCE_ID"

      - name: Deploy via SSM
        run: |
          # GHCR paths are lowercase; the Docker job pushes under this same owner.
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/kagami:latest"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"cd /opt/kagami && sed -i \\\"s|^KAGAMI_IMAGE=.*|KAGAMI_IMAGE=$IMAGE|\\\" .env && . ./.env && docker pull \$KAGAMI_IMAGE && docker compose up -d --force-recreate kagami && docker image prune -af\"]" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM Command: $COMMAND_ID"

          # Wait for completion (timeout 120s)
          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.instance.outputs.id }}" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "  Status: $STATUS"
            case "$STATUS" in
              Success) echo "Deploy successful"; exit 0 ;;
              Failed|TimedOut|Cancelled) echo "Deploy failed"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM command"
          exit 1

  # ---- iOS build verification (no signing) ----
  ios:
    name: iOS (Flutter)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure native bridge (iOS Simulator)
        run: cmake --preset ios-sim-debug

      - name: Build native bridge
        run: cmake --build out/build/ios-sim-debug --target flutter-build -j $(sysctl -n hw.ncpu)

      - name: Set up Flutter project
        working-directory: apps/flutter
        run: |
          flutter pub get
          mkdir -p ios/libs
          ln -sfn ${{ github.workspace }}/out/build/ios-sim-debug ios/libs/ios-sim

      - name: Install CocoaPods
        working-directory: apps/flutter/ios
        run: pod install

      - name: Build iOS app (simulator, no codesign)
        working-directory: apps/flutter/ios
        run: |
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Debug -sdk iphonesimulator -arch arm64 \
            CODE_SIGNING_ALLOWED=NO build
